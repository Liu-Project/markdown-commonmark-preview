name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vsce (and its undici dependency) requires Node >= 20.18.1
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p ./ --noEmit

      - name: Build (tsc + esbuild)
        run: npm run compile

      - name: Verify package
        run: npx --yes @vscode/vsce@2.32.0 package --no-dependencies --out /tmp/markdown-commonmark-preview.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-commonmark-preview-${{ matrix.node-version }}.vsix
          path: /tmp/markdown-commonmark-preview.vsix
